<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
<rect width="1000" height="620" fill="#f4f7fb"/><text x="500" y="42" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold" fill="#253a55">Three LEDs with Arduino Uno — Breadboard Layout</text>
<rect x="45" y="125" width="250" height="360" rx="18" fill="#2471b8" stroke="#174c80" stroke-width="5"/><text x="170" y="174" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold" fill="white">ARDUINO UNO</text><text x="75" y="230" font-family="Arial" font-size="19" fill="white">D8  ●</text><text x="75" y="275" font-family="Arial" font-size="19" fill="white">D9  ●</text><text x="75" y="320" font-family="Arial" font-size="19" fill="white">D10 ●</text><text x="75" y="395" font-family="Arial" font-size="19" fill="white">GND ●</text>
<rect x="390" y="95" width="510" height="430" rx="15" fill="#fffdf8" stroke="#c5c5c5" stroke-width="4"/><line x1="420" y1="130" x2="870" y2="130" stroke="#e13d3d" stroke-width="8"/><line x1="420" y1="490" x2="870" y2="490" stroke="#304556" stroke-width="8"/><text x="425" y="112" font-family="Arial" font-size="17" fill="#c42f2f">+ rail</text><text x="425" y="475" font-family="Arial" font-size="17" fill="#304556">– rail (GND)</text>
<g fill="#d9d9d9"> <circle cx="470" cy="210" r="7"/><circle cx="510" cy="210" r="7"/><circle cx="470" cy="300" r="7"/><circle cx="510" cy="300" r="7"/><circle cx="470" cy="390" r="7"/><circle cx="510" cy="390" r="7"/> </g>
<g font-family="Arial"><circle cx="610" cy="200" r="24" fill="#ee4040"/><line x1="610" y1="224" x2="610" y2="280" stroke="#555" stroke-width="5"/><text x="650" y="207" font-size="20">Red LED</text><rect x="580" y="280" width="60" height="18" fill="#e7b35a" stroke="#86652a"/><text x="650" y="296" font-size="17">220 Ω</text><line x1="610" y1="298" x2="610" y2="490" stroke="#333" stroke-width="5"/>
<circle cx="730" cy="290" r="24" fill="#f5d331"/><line x1="730" y1="314" x2="730" y2="370" stroke="#555" stroke-width="5"/><text x="770" y="297" font-size="20">Yellow LED</text><rect x="700" y="370" width="60" height="18" fill="#e7b35a" stroke="#86652a"/><text x="770" y="386" font-size="17">220 Ω</text><line x1="730" y1="388" x2="730" y2="490" stroke="#333" stroke-width="5"/>
<circle cx="610" cy="380" r="24" fill="#39b86d"/><line x1="610" y1="404" x2="610" y2="460" stroke="#555" stroke-width="5"/><text x="650" y="387" font-size="20">Green LED</text><rect x="580" y="460" width="60" height="18" fill="#e7b35a" stroke="#86652a"/><text x="650" y="476" font-size="17">220 Ω</text></g>
<path d="M145 225 H350 V200 H586" fill="none" stroke="#e34a4a" stroke-width="5"/><path d="M145 270 H360 V290 H706" fill="none" stroke="#e5bd27" stroke-width="5"/><path d="M145 315 H335 V380 H586" fill="none" stroke="#35a768" stroke-width="5"/><path d="M145 390 H370 V490 H870" fill="none" stroke="#2f4052" stroke-width="5"/><text x="48" y="575" font-family="Arial" font-size="17" fill="#4c5d6e">Connections: D8 → red LED, D9 → yellow LED, D10 → green LED. Each LED uses a 220 Ω resistor; all cathodes return to GND.</text></svg>